databaseChangeLog:
  - changeSet:
      id: 1754939393929-1
      author: korurg
      changes:
        - createTable:
            tableName: survey
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: state
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: chat_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_chat_id
                    references: telegram_chat(id)
              - column:
                  name: updated
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamptz
                  constraints:
                    nullable: false
        - createTable:
            tableName: survey_schedule
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: survey_id
                  type: bigint
                  constraints:
                    foreignKeyName: fk_survey_id
                    references: survey(id)
                    nullable: false
              - column:
                  name: start_date
                  type: date
                  constraints:
                    nullable: false
              - column:
                  name: end_date
                  type: date
              - column:
                  name: interval_cron
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: skip_until
                  type: text
              - column:
                  name: timezone
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: updated
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamptz
                  constraints:
                    nullable: false
        - createTable:
            tableName: poll
            columns:
              - column:
                  name: id
                  type: bigint
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: telegram_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: survey_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_survey_id
                    references: survey(id)
              - column:
                  name: type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: updated
                  type: timestamptz
                  constraints:
                    nullable: false
              - column:
                  name: created
                  type: timestamptz
                  constraints:
                    nullable: false
        - createTable:
            tableName: poll_answer
            columns:
              - column:
                  name: id
                  type: text
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: answer
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: poll_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_poll_id
                    references: poll(id)
              - column:
                  name: type
                  type: text
                  constraints:
                    nullable: false
              - column:
                  name: game_id_answer
                  type: bigint
                  constraints:
                    foreignKeyName: fk_game_id_answer
                    references: game(id)
              - column:
                  name: time_answer
                  type: timestamptz
